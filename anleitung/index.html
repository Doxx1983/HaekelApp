<style>
  html,body { height:100%; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 0; }
  #row { font-family:var(--display); font-size:clamp(1.25rem,5.6vw,1.6rem); font-weight:700; color:var(--ink); white-space:nowrap; }
  #pos { font-size:.9rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pos b { color:var(--ink); } #pos .warn { white-space:nowrap; color:var(--ink); background:var(--coral-soft); border-radius:999px; padding:0 8px; font-weight:700; }
  #menu { white-space:nowrap; }
  header { gap:10px; }
  #chips { flex:1; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:10px; min-height:0; }
  .chip { flex:0 0 calc(25% - 8px); height:calc(50% - 5px); max-height:220px; background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--display); font-size:clamp(1.6rem,7vw,3.2rem); font-weight:700; }
  /* Angedeutete Naht: gestrichelte Maschenreihe innen am Rand */
  .chip { position:relative; }
  .st { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .st rect { x:6px; y:6px; width:calc(100% - 12px); height:calc(100% - 12px); rx:11px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; opacity:.8; }
  /* Nur 1–2 Kacheln: breiter, damit sie nicht verloren im Raum stehen */
  #chips.few .chip { flex-basis:min(calc(50% - 5px), 320px); }
  .chip { white-space:nowrap; }
  .chip.fade { opacity:.3; }
  .chip { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .chip.count span { color:var(--coral); }
  #nav { display:flex; gap:10px; padding:12px 0; align-items:stretch; }
  #back { flex:0 0 22%; background:var(--paper-alt); border:1px solid var(--line); color:var(--ink); border-radius:999px; font-size:1.1rem; font-weight:700; }
  #next { flex:1; background:var(--coral); color:var(--ink); border-radius:999px; box-shadow:var(--shadow-soft); font-family:var(--display); font-size:1.9rem; font-weight:700; padding:22px 0; }
  #setup { display:none; flex:1; flex-direction:column; gap:10px; overflow:auto; padding-bottom:12px; }
  #setup textarea { flex:1; min-height:30vh; font:inherit; padding:10px; border-radius:10px; border:var(--field-border); background:#fff; color:var(--ink); border-radius:16px; }
  #setup .row { display:flex; gap:10px; }
  #setup button { flex:1; padding:14px; border-radius:999px; background:var(--coral); color:var(--ink); font-weight:800; }
  #colors { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #colors button { flex:0 0 auto; padding:8px 14px; white-space:nowrap; background:var(--paper-alt); color:var(--ink); border:1px solid var(--line); border-radius:999px; font-weight:700; display:flex; align-items:center; gap:6px; }
  #colors button.on { border-color:var(--ink); }
  #colors .sw i { width:18px; height:18px; border-radius:50%; border:1px solid var(--ink-soft); display:inline-block; }
  #colors .ed { flex:1 0 100%; display:flex; flex-direction:column; gap:8px; background:var(--paper-alt); padding:12px; border-radius:16px; }
  #colors .pal { display:flex; flex-wrap:wrap; gap:8px; }
  #colors .pal button { width:34px; height:34px; padding:0; border-radius:50%; border:1px solid var(--ink-soft); }
  #colors .ed label { display:flex; align-items:center; gap:8px; font-size:.85rem; } #colors .ed label input { flex:1; }
  #colors .hexrow { display:flex; gap:8px; align-items:center; } #colors .prev { width:34px; height:34px; border-radius:50%; border:1px solid var(--ink-soft); }
  #colors input:not([type=range]) { font:inherit; padding:8px 10px; border-radius:12px; border:var(--field-border); background:#fff; color:var(--ink); min-width:0; flex:1; }
  #row .dot { display:inline-block; width:.9em; height:.9em; border-radius:50%; vertical-align:middle; margin-left:6px; border:1px solid var(--ink-soft); }
  /* Auswahl aus der Mustersammlung */
  #setup #pick { flex:none; align-self:stretch; background:var(--paper-alt); border:1px solid var(--line); box-shadow:var(--shadow-card); font-weight:800; }
  #lib { display:flex; flex-direction:column; gap:8px; background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; padding:12px; }
  #lib[hidden] { display:none; }
  #lib .head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-family:var(--display); font-size:1.15rem; font-weight:700; }
  #lib .head a { font-family:var(--body); font-size:.85rem; color:var(--ink-soft); text-decoration:none; white-space:nowrap; }
  #libq { font:inherit; padding:10px 14px; border-radius:999px; border:var(--field-border); background:#fff; color:var(--ink); min-width:0; }
  #libtags { display:flex; flex-wrap:wrap; gap:6px; } #libtags:empty { display:none; }
  #setup #libtags button, #setup #liblist button { flex:none; padding:0; border-radius:0; background:none; font-weight:700; }
  #setup #libtags button { min-height:40px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:.85rem; }
  #setup #libtags button.on { background:var(--coral-soft); border-color:var(--ink); }
  #liblist { display:flex; flex-direction:column; gap:6px; max-height:32vh; overflow:auto; }
  #setup #liblist button { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  #setup #liblist button.cur { border-color:var(--ink); }
  #liblist b { font-family:var(--display); font-size:1.05rem; line-height:1.2; overflow-wrap:anywhere; }
  #liblist small, #lib .note { color:var(--ink-soft); font-size:.8rem; font-weight:600; }
  #lib .note:empty { display:none; } #lib .note { margin:0; }
  /* Projekte */
  #projs { display:flex; flex-direction:column; gap:8px; background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; padding:12px; }
  #projs .head { display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:var(--display); font-size:1.15rem; font-weight:700; }
  #projs .head small { font-family:var(--body); font-size:.8rem; color:var(--ink-soft); font-weight:700; }
  #setup #newp { flex:none; min-height:44px; padding:8px 14px; font-size:.85rem; box-shadow:none; }
  #plist { display:flex; flex-direction:column; gap:6px; } #plist:empty { display:none; }
  #plist .it { display:flex; gap:6px; }
  #setup #plist button { border-radius:12px; background:var(--paper); border:1px solid var(--line); font-weight:700; padding:10px 12px; }
  #setup #plist .open { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }
  #setup #plist .open.cur { border-color:var(--ink); }
  #plist .open b { font-family:var(--display); font-size:1.05rem; line-height:1.2; overflow-wrap:anywhere; }
  #plist .open small { color:var(--ink-soft); font-size:.8rem; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #plist .open .tag { background:var(--ink); color:var(--paper); border-radius:999px; padding:1px 8px; font-size:.7rem; }
  #plist .open .dots i { display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid var(--ink-soft); margin-right:2px; vertical-align:-1px; }
  #plist .open .prog { align-self:stretch; height:6px; border-radius:3px; background:var(--paper-alt); overflow:hidden; margin-top:4px; }
  #plist .open .prog i { display:block; height:100%; background:var(--coral); border-radius:3px; }
  #pempty { margin:0; color:var(--ink-soft); font-size:.9rem; }
  #setup #plist .del { flex:none; width:44px; padding:0; color:var(--ink-soft); font-size:1.2rem; }
  #edhead { font-family:var(--display); font-size:1.15rem; font-weight:700; margin:4px 0 -2px; }
  #pname { font:inherit; padding:10px 14px; border-radius:999px; border:var(--field-border); background:#fff; color:var(--ink); min-width:0; }
  body.setup #setup { display:flex; } body.setup #chips, body.setup #nav { display:none; }
</style>

<body>
<header>
  <div class="title"><a class="home" href="../" aria-label="Alle Apps" title="Alle Apps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg></a><img class="logo" src="../shared/logo.png" alt="Isadody"><div><div id="row">Häkelhelfer</div><div id="pos"></div></div></div>
  <div class="tools"><a class="help" href="hilfe/" aria-label="Hilfe" title="Hilfe">?</a><button class="small" id="menu">Projekte</button></div>
</header>
<main id="chips"></main>
<div id="nav"><button id="back">‹ Zurück</button><button id="next">Weiter ›</button></div>
<section id="setup">
  <div id="projs">
    <div class="head"><span>Meine Projekte <small id="pcount"></small></span><button id="newp" type="button">+ Neues Projekt</button></div>
    <div id="plist"></div>
    <p id="pempty" hidden>Noch keine Projekte. Füge unten eine Anleitung ein oder lade eine Datei, gib ihr einen Namen und tippe auf <b>Starten</b>.</p>
  </div>
  <div id="lib" hidden>
    <div class="head">Aus der Sammlung<a href="../muster/">Sammlung öffnen ›</a></div>
    <input id="libq" type="search" placeholder="Suchen: Name, Tag, Text">
    <div id="libtags"></div>
    <div id="liblist"></div>
    <p class="note" id="libnote"></p>
  </div>
  <div id="edhead"></div>
  <button id="pick" type="button">Externe Datei laden</button>
  <input type="file" id="file" hidden>
  <input id="pname" placeholder="Name des Projekts" maxlength="60">
  <div id="colors"></div>
  <textarea id="text" placeholder="Anleitung hier einfügen"></textarea>
  <div class="row"><button id="ok">Starten</button></div>
</section>
<script>
const MAX_CHIPS = 8, SINGLE_MAX = 3; // Folgen bis 3 Maschen einzeln, ab 4 als ein Kürzel mit Anzahl

function splitTop(s) {
  const out = []; let d = 0, cur = '';
  for (const c of s) {
    if (c === '(') d++; if (c === ')') d--;
    if (c === ',' && d === 0) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out.map(x => x.trim()).filter(Boolean);
}

const COLOR_RE = /^(?:(?:use|wechsel\w*|nimm|change)\s+)?(?:(?:to|zu)\s+)?(?:farbe|colou?r)\s+([\p{L}\d]+)/iu;
// Maschenglied: BLO/FLO bzw. hMg/vMg, vor oder hinter dem Kürzel
const MOD = String.raw`(?:BLO|FLO|BL|FL|hMg|vMg|hinter\w*\s+Maschenglied\w*|vorder\w*\s+Maschenglied\w*)`;
const MOD_RE = new RegExp(String.raw`^(?:(?:in|im|ins|into|nur|only|the)\s+)*(${MOD})(?:\s+(?:only|nur))?(?![\p{L}\d])[\s:]*`, 'iu');
const MOD_AFTER = new RegExp(String.raw`^\s*(?:(?:in|ins|into|nur|only|the)\s+)*(${MOD})(?![\p{L}\d])`, 'iu');
const modName = m => /^(BLO?|hint|hMg)/i.test(m) ? (/^[hH]/.test(m) ? 'hMg' : 'BLO') : (/^[vV]/.test(m) ? 'vMg' : 'FLO');
// Kürzel aus zwei Wörtern, sonst ein Wort wie fM, sc2tog, Stb-Büschel
const PHRASE = /^(?:sl\.?\s*st|inv(?:isible)?\.?\s*dec|inv\.?\s*abn\w*|unsichtbare?\s+abn\w*|magic\s+(?:ring|circle)|magischer\s+ring)\b/i;
const WORD = /^[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß\d]*(?:-[A-Za-zÄÖÜäöüß]+)*/;
const FILL = /\b(?:each|every|all|around|across|jede\w*|alle\w*|rundherum|ringsum)\b/i;

// Eine Masche (ohne Klammern): {s, n, fill}
function stitchOf(part) {
  let p = part, n = 1, m;
  const num = () => { if ((m = p.match(/^(\d+)\s*(?:[x×*]\s*)?/))) { n = +m[1]; p = p.slice(m[0].length); } };
  // „jede M verdoppeln“ / „in jede M 2 fM“ / „2 sc in each st“: Zunahme in jeder Masche
  if (/^(?:in\s+)?(?:jede|alle)\w*\s+M\w*\s+verdoppeln/i.test(p)) return { s: 'Zun', n: 1, fill: true };
  if ((m = p.match(/^(?:in\s+)?(?:jede|each|every)\w*\s+(?:M|Masche|st|stitch)\w*\s*:?\s+(\d+)\s*([A-Za-zÄÖÜäöüß]+)/i))) p = `${m[1]} ${m[2]} in jede M`;
  num();
  if (n > 1 && (m = p.match(/^([A-Za-zÄÖÜäöüß]+)\s+(?:in|into)\s+(?:jede|each|every)\w*\s+(?:M|Masche|st|stitch)\b/i)))
    return { s: n === 2 ? (/^(sc|hdc|dc|tr)$/i.test(m[1]) ? 'inc' : 'Zun') : `${n} ${m[1]} in 1 M`, n: 1, fill: true };
  let mod = ''; if ((m = p.match(MOD_RE))) { mod = modName(m[1]); p = p.slice(m[0].length); num(); }
  if (!p && mod) return { mod };
  let s;
  if ((m = p.match(/^(fM|Stb|hStb|DStb|M)\s+zus\w*\.?(?:\s+abm\w*\.?)?/i)) && n > 1) { s = `${n} ${m[1]} zus.`; n = 1; }
  else if ((m = p.match(PHRASE) || p.match(WORD))) s = m[0].replace(/\s+/g, ' ');
  else return null;
  let rest = p.slice(m[0].length), k;
  if ((k = rest.match(MOD_AFTER))) { mod = mod || modName(k[1]); rest = rest.slice(k[0].length); }
  let explicit = n > 1;
  if ((k = rest.match(/^\s*(?:[x×*]\s*(\d+)|(\d+)\s*(?:[x×]|mal\b|times?\b)?)(?![\d.,]*\d)/i))) { n *= +(k[1] || k[2]); explicit = true; }
  else if ((k = rest.match(/\b(?:next|nächsten|folgenden)\s+(\d+)\b/i))) { n *= +k[1]; explicit = true; }
  return { s: mod ? `${s} ${mod}` : s, n, fill: !explicit && FILL.test(rest) };
}

// Text einer Reihe vereinheitlichen: [..], {..}, *..* → (..); „6x wiederholen“, „repeat 6 times“ → x 6; „rep from * 5 more times“
function normalize(s) {
  s = s.replace(/\*([^*]*?)[,;]?\s*(?:rep(?:eat)?\.?\s+(?:from\s+)?\*\s*(?:(\d+)\s*(more\s+)?times?|around|across|to\s+(?:the\s+)?end)|(?:(?:wdh\.?|wiederhole\w*)\s+)?(?:ab|von)\s+\*\s*(?:(noch\s+|weitere\s+)?(\d+)\s*(?:[x×]|-?mal)\s*(?:wiederhol\w*|wdh\.?)?|(?:wiederhol\w*\s+)?(?:rundherum|ringsum|bis\s+(?:zum\s+)?\w*ende)\s*(?:wiederhol\w*)?))/gi,
    (a, body, n1, more, noch, n2) => `(${body}) x ${n1 ? +n1 + (more ? 1 : 0) : n2 ? +n2 + (noch ? 1 : 0) : 0}`);
  s = s.replace(/\*([^*]+)\*/g, '($1)').replace(/[\[{]/g, '(').replace(/[\]}]/g, ')');
  s = s.replace(/\)\s*(?:(?:wiederhol\w*|wdh\.?|repeat|rep)\s+)?(?:[x×*]\s*(\d+)|(\d+)\s*(?:[x×*]|-?mal\b|times?\b))(?:\s*(?:times?|mal)\b)?(?:\s*(?:wiederhol\w*|wdh\.?|repeat|insgesamt|total)\b)*/gi,
    (a, n1, n2) => `) x ${n1 || n2}`);
  s = s.replace(/\)\s*(?:(?:rep(?:eat)?|wiederhol\w*)\s+)?(?:around|across|to\s+(?:the\s+)?end|rundherum|ringsum|bis\s+(?:zum\s+)?\w*ende)(?:\s*wiederhol\w*)?/gi, ') x 0');
  return s;
}

// ctx.color = aktuelle Garnfarbe; Farbwechsel mitten in der Reihe wirken ab dieser Stelle.
// Ergebnis: Maschen {s, c} und höchstens eine Füllgruppe {fill: [...]} („rundherum“, „in jede M“), die parse() auf die Maschenzahl auffüllt
function expand(s, ctx) {
  const res = [];
  for (let part of splitTop(s)) {
    let c = part.match(COLOR_RE);
    if (c) { ctx.color = c[1].toUpperCase(); part = part.slice(c[0].length).replace(/^[\s:;–-]+/, ''); if (!part) continue; }
    let m = part.match(/^\((.*)\)\s*x\s*(\d+)/i) || part.match(/^(\d+)\s*[x×]\s*\((.*)\)/i);
    if (m) {
      const [body, n] = /^\(/.test(part) ? [m[1], +m[2]] : [m[2], +m[1]];
      const inner = expand(body, { ...ctx, mod: '' }); ctx.color = inner.color;
      if (!n) { res.push({ fill: inner.list }); continue; }
      for (let i = 0; i < n; i++) res.push(...inner.list);
      continue;
    }
    if ((m = part.match(/^\((.*)\)$/))) { const inner = expand(m[1], ctx); ctx.color = inner.color; res.push(...inner.list); continue; }
    const st = stitchOf(part);
    if (!st) continue;
    if (!st.s) { ctx.mod = st.mod; continue; } // „BLO:“ gilt für den Rest der Reihe
    const name = ctx.mod && !/ (BLO|FLO|hMg|vMg)$/.test(st.s) && weight(st.s) ? `${st.s} ${ctx.mod}` : st.s;
    const one = () => ({ s: name, c: ctx.color });
    if (st.fill) res.push({ fill: [one()] });
    else for (let i = 0; i < st.n; i++) res.push(one());
  }
  return Object.assign(res, { list: res, color: ctx.color });
}

// Maschen, die eine Masche ergibt: Zunahme 2, Lm/Km/Wenden 0, sonst 1. known = sicher gezählt (für die Kontrolle)
function weight(s) {
  let m; const t = s.toLowerCase().replace(/ (blo|flo|hmg|vmg)$/, '');
  if (/^(inc|zun\w*|zu)$/.test(t)) return 2;
  if ((m = t.match(/^(\d+) \S+ in 1 m$/))) return +m[1];
  if (/^(wende-?lm|wendeluftm\w*|t-?ch)$/.test(t)) return 0;
  if (/^(ch|lm|luftm\w*|sl st|ss|km|kettm\w*|turn|wenden?|mr|magic \w+|magischer ring|fadenring|fr)$/.test(t)) return 0;
  return 1;
}
const known = s => /^(\d+ \S+ in 1 m|wende-?lm|sc|fm|hdc|hstb|dc|stb|tr|dstb|dtr|inc|zun\w*|zu|dec|abn\w*|\w+tog|\d \w+ zus\.|inv dec|inv abn\w*|unsichtbare? abn\w*|turn|wenden?|mr|magic \w+|magischer ring|fadenring)$/
  .test(s.toLowerCase().replace(/ (blo|flo|hmg|vmg)$/, ''));

function chipsOf(stitches) {
  const chips = [], same = (a, b) => a.s === b.s && a.c === b.c;
  for (let i = 0; i < stitches.length;) {
    let j = i; while (j < stitches.length && same(stitches[j], stitches[i])) j++;
    const n = j - i;
    if (n <= SINGLE_MAX) for (let k = 0; k < n; k++) chips.push({ ...stitches[i], n: 1 });
    else chips.push({ ...stitches[i], n });
    i = j;
  }
  return chips;
}

// Reihe: {label, pages, count (Maschen am Ende), target (Zahl aus der Anleitung, z. B. „(18)“), check (gezählt ≠ Anleitung)}
const ROW = /^\s*(?:Reihen|Reihe|Runden|Runde|Rounds|Round|Rows|Row|Rnds|Rnd|Rds|Rd|R)\.?\s*(\d+)(?:\s*(?:-|–|—|bis|to)\s*(?:Reihe|Runde|Round|Row|Rnd|Rd|R)?\.?\s*(\d+)(?=\s*(?:[:.)(]|$)))?\s*[:.\-–)]?\s*(.*)$/i;
const TARGET = /\s*(?:[(\[{]\s*(\d+)\s*(?:M|Maschen|Masche|st|sts|stitches|fM|sc)?\.?\s*[)\]}]|(?:=|–|—|\s-)\s*(\d+)\s*(?:M|Maschen|st|sts|stitches)?\.?)\s*\.?\s*$/i;
// Zahl vorn: „1. Rd:“, „3.-5. Runde:“ → wie ROW [_, von, bis, Rest]
const ROW_DE = /^\s*(\d+)\.?(?:\s*(?:-|–|—|bis)\s*(\d+)\.?)?\s*(?:Reihen|Reihe|Runden|Runde|Rnd|Rd|R)\b\.?\s*[:.\-–)]?\s*(.*)$/i;
const rowOf = l => l.match(ROW) || l.match(ROW_DE);
function parse(text) {
  const rows = [], ctx = { color: '' };
  const lines = text.split(/\r?\n/), numbered = lines.some(l => rowOf(l));
  for (const line of lines) {
    if (!line.trim()) continue;
    const m = rowOf(line);
    // Gibt es nummerierte Reihen, sind andere Zeilen Überschriften oder Notizen: keine Maschen, nur Farbwechsel zählen
    if (!m && numbered) { expand(line, ctx); continue; }
    let body = m ? m[3] : line, target = null, t;
    if ((t = body.match(TARGET))) { target = +(t[1] || t[2]); body = body.slice(0, t.index); }
    body = normalize(body.replace(new RegExp(String.raw`^\(\s*(${MOD})[^)]*\)\s*:?\s*`, 'i'), '$1, '));
    ctx.mod = '';
    let list = expand(body, ctx).list;
    // Ohne Reihennummern: Zeilen ohne bekanntes Kürzel und ohne Zahl (Titel, „Kopf“, „Füllen“) sind keine Reihe
    if (!m && !/\d/.test(body) && !list.some(x => known(x.s) || (x.fill && x.fill.some(y => known(y.s))))) continue;
    const fills = list.filter(x => x.fill);
    if (fills.length) { // auffüllen bis zur Maschenzahl, ohne Angabe einmal
      const rest = list.filter(x => !x.fill).reduce((a, x) => a + weight(x.s), 0), g = fills[0].fill, gw = g.reduce((a, x) => a + weight(x.s), 0);
      const k = target && gw && (target - rest) % gw === 0 && target > rest ? (target - rest) / gw : 1;
      list = list.flatMap(x => x === fills[0] ? Array.from({ length: k }, () => g).flat() : x.fill ? x.fill : [x]);
    }
    const allCh = list.length && list.every(x => /^(ch|lm)$/i.test(x.s));
    const count = allCh ? list.length : list.reduce((a, x) => a + weight(x.s), 0);
    const check = target != null && !fills.length && list.every(x => known(x.s)) && count !== target;
    const chips = chipsOf(list), pages = [];
    for (let i = 0; i < chips.length; i += MAX_CHIPS) pages.push(chips.slice(i, i + MAX_CHIPS));
    if (!pages.length) continue;
    const a = m ? +m[1] : rows.length + 1, b = m && m[2] && +m[2] > a && +m[2] - a <= 200 ? +m[2] : a;
    for (let n = a; n <= b; n++) rows.push({ label: m ? String(n) : String(rows.length + 1), pages, count, target, check });
  }
  return rows;
}

const SEAM = '<svg class="st" aria-hidden="true"><rect/></svg>';
// Nahtstriche: ganze Anzahl Striche pro Umfang, damit Ecken und Anschluss gleichmäßig sind
function fitSeams() {
  document.querySelectorAll('.st rect').forEach(r => {
    try {
      const L = r.getTotalLength(); if (!L) return;
      const u = L / Math.max(8, Math.round(L / 15));
      r.style.strokeDasharray = `${u * 0.5} ${u * 0.5}`;
      r.style.strokeDashoffset = u * 0.25;
    } catch {}
  });
}
addEventListener('resize', fitSeams);

const store = Store('anleitung');
store.migrate(['pattern', 'pos', 'done', 'colors']); // Daten aus der Zeit vor der App-Sammlung

// P = aktives Projekt (Kacheln), E = Projekt im Bearbeiten-Bereich (P oder ein neues ohne id)
let P = null, E = null, colors = { ...Projekte.DEFAULT_COLORS };
const draft = () => ({ id: null, name: '', pattern: '', colors: { ...Projekte.DEFAULT_COLORS, ...(P ? P.colors : {}) } });
const saveColors = () => { if (E && E.id) Projekte.put(E); };
const textOn = hex => { const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150 ? '#222' : '#fff'; };
const colorKeysIn = t => [...t.matchAll(/(?:farbe|colou?r)\s+([\p{L}\d]+)/giu)].map(m => m[1].toUpperCase());

const PRESETS = ['#E53935','#F2896B','#F5C84C','#FFEB3B','#8FC9A9','#43A047','#1B5E20','#8CB4D9','#1E88E5','#0D47A1','#8E24AA','#F48FB1','#D81B60','#795548','#BCAAA4','#FFFFFF','#BDBDBD','#616161','#22201B'];
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h);
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
}

// Eigene Farbauswahl (Paletten, Regler, Hex) – <input type=color> geht in installierten Apps nicht überall
let editing = null;
function renderColorPickers() {
  const keys = [...new Set([...Object.keys(colors), ...colorKeysIn($('text').value)])].sort();
  const box = $('colors'); box.innerHTML = '';
  const setColor = (k, hex) => { colors[k] = hex.toUpperCase(); saveColors(); };
  for (const k of keys) {
    const b = document.createElement('button');
    b.className = 'sw' + (k === editing ? ' on' : '');
    b.innerHTML = `<i style="background:${hexOk(colors[k] || '') ? colors[k] : 'transparent'}"></i>${esc(k)}`;
    b.onclick = () => { editing = editing === k ? null : k; renderColorPickers(); };
    box.append(b);
  }
  const add = document.createElement('button'); add.textContent = '+ Farbe';
  add.onclick = () => { editing = '+'; renderColorPickers(); };
  box.append(add);
  if (!editing) return;

  const ed = document.createElement('div'); ed.className = 'ed';
  let key = editing;
  if (editing === '+') {
    const n = document.createElement('input'); n.placeholder = 'Name, z. B. C'; n.maxLength = 12;
    const ok = document.createElement('button'); ok.textContent = 'Anlegen';
    ok.onclick = () => { const v = n.value.trim().toUpperCase(); if (/^[\p{L}\d]{1,12}$/u.test(v)) { colors[v] = colors[v] || '#888888'; saveColors(); editing = v; renderColorPickers(); } };
    ed.append(n, ok); box.append(ed); return;
  }
  const cur = hexOk(colors[key] || '') ? colors[key] : '#888888';
  const pal = document.createElement('div'); pal.className = 'pal';
  for (const p of PRESETS) {
    const c = document.createElement('button'); c.style.background = p; c.setAttribute('aria-label', p);
    c.onclick = () => { setColor(key, p); renderColorPickers(); };
    pal.append(c);
  }
  const [h, s, l] = hexToHsl(cur);
  const hex = document.createElement('input'); hex.value = cur.toUpperCase(); hex.maxLength = 7; hex.className = 'hex';
  const sliders = [['Farbton', 360, h, v => hslToHex(v, S.value, L.value)], ['Sättigung', 100, s, v => hslToHex(H.value, v, L.value)], ['Helligkeit', 100, l, v => hslToHex(H.value, S.value, v)]]
    .map(([name, max, val, f], i) => {
      const w = document.createElement('label'), r = document.createElement('input');
      r.type = 'range'; r.min = 0; r.max = max; r.value = val;
      r.oninput = () => { const x = hslToHex(+H.value, +S.value, +L.value); setColor(key, x); hex.value = x; prev.style.background = x; box.querySelector('.sw.on i').style.background = x; };
      w.append(name, r); return [w, r];
    });
  const [H, S, L] = sliders.map(x => x[1]);
  const prev = document.createElement('i'); prev.className = 'prev'; prev.style.background = cur;
  hex.oninput = () => {
    let v = hex.value.trim(); if (v && v[0] !== '#') v = '#' + v;
    if (!hexOk(v)) return;
    setColor(key, v); prev.style.background = v; box.querySelector('.sw.on i').style.background = v;
    [H.value, S.value, L.value] = hexToHsl(v);
  };
  const row = document.createElement('div'); row.className = 'hexrow'; row.append(prev, hex);
  ed.append(pal, ...sliders.map(x => x[0]), row);
  box.append(ed);
}

const $ = id => document.getElementById(id);
let rows = [], r = 0, p = 0;
let done = {}; // Reihe -> Anzahl abgeschlossener Kacheln
// label: Reihen-Bezeichnung aus der Anleitung (z. B. „0“ bei Row 0), für die Startseite
const save = () => { if (!P) return; P.pos = { r, p, label: rows[r] ? rows[r].label : String(r + 1) }; P.done = done; P.used = Date.now(); Projekte.put(P); };
function load(proj) {
  P = proj; rows = []; r = p = 0; done = {};
  if (!P) return;
  Projekte.setCurrent(P.id); colors = P.colors; rows = parse(P.pattern); done = P.done || {};

}
function openSetup(proj) {

  $('edhead').textContent = E.id ? 'Anleitung bearbeiten' : 'Neues Projekt';
  $('ok').textContent = E.id ? 'Weiterhäkeln' : 'Starten';
  // Kopf zeigt, wo man ist; der Knopf führt zurück zum Häkeln (nur wenn es ein Projekt gibt)
  $('row').textContent = 'Projekte'; $('pos').innerHTML = P ? `Aktiv: <b>${esc(P.name)}</b>` : 'Leg dein erstes Projekt an';
  $('menu').textContent = '‹ Häkeln'; $('menu').hidden = !P;
  renderProjects(); renderColorPickers(); loadLib();

const ago = t => {
  const d = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(t || 0).setHours(0, 0, 0, 0)) / 864e5);
  return d <= 0 ? 'heute' : d === 1 ? 'gestern' : d < 30 ? `vor ${d} Tagen` : new Date(t).toLocaleDateString('de-DE');
};
function renderProjects() {
  const list = Projekte.all().sort((a, b) => b.used - a.used);
  $('pcount').textContent = list.length ? `${list.length} von ${Projekte.MAX}` : '';
  $('pempty').hidden = !!list.length;
  $('plist').innerHTML = list.map(x => {
    const pr = parse(x.pattern), n = pr.length, at = Math.min(n, ((x.pos && x.pos.r) || 0) + 1), act = P && x.id === P.id, lab = pr[at - 1] ? pr[at - 1].label : at;
    const pct = n ? Math.round((at - 1) / n * 100) : 0, keys = colorKeysIn(x.pattern).filter((k, i, a) => a.indexOf(k) === i && x.colors[k]);
    return `<div class="it"><button class="open${act ? ' cur' : ''}" data-id="${esc(x.id)}"><b>${esc(x.name)}</b>` +
      `<small>${act ? '<span class="tag">Aktiv</span>' : ''}Reihe ${esc(lab)} · ${at} von ${n} · ${ago(x.used)}` +
      (keys.length ? `<span class="dots">${keys.map(k => `<i style="background:${esc(x.colors[k])}" title="Farbe ${esc(k)}"></i>`).join('')}</span>` : '') + `</small>` +
      `<span class="prog" aria-label="${pct} % geschafft"><i style="width:${pct}%"></i></span></button>` +
      `<button class="del" data-del="${esc(x.id)}" aria-label="Projekt ${esc(x.name)} löschen" title="Löschen">×</button></div>`;
  }).join('');
}
$('plist').onclick = async e => {
  const o = e.target.closest('[data-id]'), d = e.target.closest('[data-del]');
  if (o) { const x = Projekte.all().find(q => q.id === o.dataset.id); if (x) { x.used = Date.now(); Projekte.put(x); load(x); render(); } return; }
  if (!d) return;
  const x = Projekte.all().find(q => q.id === d.dataset.del);
  if (!x || !(await Dialog.confirm(`Projekt „${x.name}“ löschen? Anleitung und Fortschritt gehen verloren.`, { ok: 'Löschen', danger: true }))) return;
  Projekte.remove(x.id);
  if (P && P.id === x.id) load(Projekte.all().sort((a, b) => b.used - a.used)[0] || null);
  if (E && E.id === x.id) openSetup(P); else renderProjects();
};
$('newp').onclick = () => {
  if (Projekte.full()) return Dialog.alert(`Es sind schon ${Projekte.MAX} Projekte gespeichert. Bitte erst eins löschen.`);
  openSetup(null); $('text').focus();
};

function render(noSave) {
  if (!rows.length) { openSetup(P); return; }
  document.body.classList.remove('setup'); colors = P.colors;
  $('menu').textContent = 'Projekte'; $('menu').hidden = false;
  const col = k => hexOk(colors[k] || '') ? colors[k] : ''; // nur #RRGGBB kommt in style
  const row = rows[r], page = row.pages[p];
  const used = [...new Set(page.map(c => c.c).filter(col))];
  $('row').innerHTML = `Reihe ${esc(row.label)}` + used.map(k => `<span class="dot" style="background:${col(k)}" title="Farbe ${esc(k)}"></span>`).join('');
  // Maschenzahl am Reihenende: aus der Anleitung („(18)“), sonst gezählt; Warnung, wenn beides nicht passt
  const end = row.target != null ? row.target : row.count;
  $('pos').innerHTML = `${r + 1} von ${rows.length}` + (row.pages.length > 1 ? ` · Seite ${p + 1}/${row.pages.length}` : '') + (end ? ` · <b>${end} M</b>` : '') +
    (row.check ? ` <span class="warn" title="Die Maschen dieser Reihe ergeben ${row.count}, die Anleitung nennt ${row.target}.">⚠ gezählt ${row.count}</span>` : '') + ` · ${esc(P.name)}`;
  const d = done[r] || 0;
  $('chips').innerHTML = page.map((c, i) => {
    const cl = col(c.c), fade = p * MAX_CHIPS + i < d ? ' fade' : '', st = cl ? ` style="background:${cl};color:${textOn(cl)}"` : '';
    return c.n > 1 ? `<div class="chip count${fade}" data-i="${i}"${st}><span${cl ? ' style="color:inherit"' : ''}>${c.n}×</span>${esc(c.s)}${SEAM}</div>` : `<div class="chip${fade}" data-i="${i}"${st}>${esc(c.s)}${SEAM}</div>`;
  }).join('');
  $('chips').classList.toggle('few', page.length <= 2);
  fitSeams();
  $('back').disabled = r === 0 && p === 0;
  const last = r === rows.length - 1 && p === row.pages.length - 1;
  $('next').textContent = last ? 'Fertig ✓' : 'Weiter ›';
  $('next').disabled = last;
  if (!noSave) save();
}

$('chips').onclick = async e => {
  const el = e.target.closest('.chip'); if (!el) return;
  const g = p * MAX_CHIPS + +el.dataset.i;
  if (g < (done[r] || 0)) { if (!(await Dialog.confirm('Fortschritt hier zurücksetzen? Dieser und alle folgenden Schritte werden wieder aktiv.', { ok: 'Zurücksetzen' }))) return; done[r] = g; }
  else done[r] = g + 1;
  render();
};
$('next').onclick = () => { if (p < rows[r].pages.length - 1) p++; else if (r < rows.length - 1) { r++; p = 0; } render(); };
$('back').onclick = () => { if (p > 0) p--; else if (r > 0) { r--; p = rows[r].pages.length - 1; } render(); };
$('menu').onclick = () => document.body.classList.contains('setup') && P ? render() : openSetup(P);
$('text').oninput = renderColorPickers;
$('file').accept = FILE_ACCEPT;
$('pick').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const t = await fileText(f);
  if (t.trim()) {
    // Datei wird ein neues Projekt, außer der Bereich ist gerade leer
    if (E.id && $('text').value.trim()) { if (Projekte.full()) { Dialog.alert(`Es sind schon ${Projekte.MAX} Projekte gespeichert. Bitte erst eins löschen.`); e.target.value = ''; return; } openSetup(null); }
    if (!$('pname').value.trim()) $('pname').value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
    $('text').value = t; renderColorPickers();
  }
  else Dialog.alert(fileKind(f) ? 'Aus dieser Datei kann der Häkelhelfer keinen Text lesen (Bild, PDF oder alte .doc). Bitte den Text einfügen.' : 'Dieses Dateiformat wird nicht unterstützt.');
  e.target.value = '';
};
// Textmuster aus der Mustersammlung (IndexedDB von muster/); Bilder, PDFs und .doc ohne Text sind nicht wählbar
let lib = [], libSel = new Set();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
async function loadLib() {
  let all; try { all = await MusterDB.all(); } catch { return; }
  lib = all.filter(it => it.text && it.text.trim()).sort((a, b) => b.fav - a.fav || b.added - a.added);
  $('lib').hidden = !all.length;
  const skip = all.length - lib.length;
  $('libnote').textContent = skip ? `${skip} ${skip === 1 ? 'Muster ist ein Bild oder PDF' : 'Muster sind Bilder oder PDFs'} ohne Text und ${skip === 1 ? 'fehlt' : 'fehlen'} hier.` : '';
  renderLib();
}
function renderLib() {
  const tags = new Map();
  for (const it of lib) for (const t of it.tags || []) { const k = t.toLowerCase(); if (!tags.has(k)) tags.set(k, t); }
  for (const k of [...libSel]) if (!tags.has(k)) libSel.delete(k);
  $('libtags').innerHTML = [...tags].sort((a, b) => a[1].localeCompare(b[1], 'de'))
    .map(([k, t]) => `<button data-tag="${esc(k)}"${libSel.has(k) ? ' class="on"' : ''}>${esc(t)}</button>`).join('');
  const q = $('libq').value.trim().toLowerCase().split(/\s+/).filter(Boolean), now = P ? P.pattern : '', pats = new Set(Projekte.all().map(x => x.pattern));
  const vis = lib.filter(it => {
    const tg = (it.tags || []).map(t => t.toLowerCase());
    if (![...libSel].every(t => tg.includes(t))) return false;
    const hay = [it.title, it.notes, ...(it.tags || []), it.text].join(' ').toLowerCase();
    return q.every(w => hay.includes(w));
  });
  $('liblist').innerHTML = !lib.length ? '<small>Noch keine Textmuster in der Sammlung.</small>' : !vis.length ? '<small>Nichts gefunden.</small>' :
    vis.map(it => `<button data-id="${esc(it.id)}"${it.text === now ? ' class="cur"' : ''}><b>${it.fav ? '★ ' : ''}${esc(it.title)}</b>` +
      `<small>${it.text === now ? 'Aktiv · ' : pats.has(it.text) ? 'Projekt · ' : ''}${esc((it.tags || []).join(', ') || it.text.trim().split('\n')[0].slice(0, 60))}</small></button>`).join('');
}
$('libq').oninput = renderLib;
$('libtags').onclick = e => { const b = e.target.closest('[data-tag]'); if (!b) return; const k = b.dataset.tag; libSel.has(k) ? libSel.delete(k) : libSel.add(k); renderLib(); };
$('liblist').onclick = e => {
  const b = e.target.closest('[data-id]'), it = b && lib.find(x => x.id === b.dataset.id); if (!it) return;
  if (!Projekte.open(it.text, it.title, it.colors)) return Dialog.alert(`Es sind schon ${Projekte.MAX} Projekte gespeichert. Bitte erst eins löschen.`);
  load(Projekte.current()); render();
};
// Geänderte Anleitung (z. B. Tippfehler korrigiert): Häkchen gleich gebliebener Reihen und die Position bleiben
function keepProgress(x, t) {
  const before = parse(x.pattern), after = parse(t), sig = row => row && JSON.stringify([row.label, row.pages]), done = {};
  for (const [i, n] of Object.entries(x.done || {})) if (after[i] && sig(before[i]) === sig(after[i])) done[i] = n;
  const s = x.pos || {}, r = Math.max(0, Math.min(s.r || 0, after.length - 1));
  x.done = done; x.pos = { r, p: after[r] ? Math.min(s.p || 0, after[r].pages.length - 1) : 0, label: after[r] ? after[r].label : String(r + 1) };
}
$('ok').onclick = () => {
  const t = $('text').value, name = $('pname').value.trim();
  if (!parse(t).length) return Dialog.alert('In diesem Text sind keine Maschen zu finden.');
  if (!E.id) {
    const x = Projekte.create(t, name, E.colors);
    if (!x) return Dialog.alert(`Es sind schon ${Projekte.MAX} Projekte gespeichert. Bitte erst eins löschen.`);
    load(x);
  } else {
    if (E.pattern !== t) keepProgress(E, t);
    E.pattern = t; E.name = name || Projekte.nameOf(t); E.used = Date.now(); Projekte.put(E); load(E);
  }
  render();
};

// Andere Tabs oder Apps haben Projekte geändert: frisch laden, damit hier kein alter Stand zurückgeschrieben wird
addEventListener('storage', e => {
  if (e.key !== 'anleitung.projects') return;
  const list = Projekte.all(), fresh = id => list.find(q => q.id === id);
  if (document.body.classList.contains('setup')) {
    if (E && E.id && fresh(E.id)) { const y = fresh(E.id); E.pos = y.pos; E.done = y.done; E.used = y.used; }
    if (P && fresh(P.id)) { const y = fresh(P.id); P.pos = y.pos; P.done = y.done; P.used = y.used; }
    return renderProjects();
  }
  load((P && fresh(P.id)) || Projekte.current() || list.sort((a, b) => b.used - a.used)[0] || null);
  if (P) render(true); else openSetup(null);
});
load(Projekte.current() || Projekte.all().sort((a, b) => b.used - a.used)[0] || null);
