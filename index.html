<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isadody Häkel-Apps</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/isadody.css">
<style>
  body { padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); max-width:720px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; padding:10px 0 4px; }
  h1 { font-family:var(--display); font-size:1.8rem; font-weight:700; margin:0; line-height:1.1; }
  header p { margin:0; color:var(--ink-soft); font-size:.95rem; }
  #apps { display:grid; gap:14px; padding:16px 0 24px; }
  /* Karte mit angedeuteter Naht wie die Kacheln im Häkelhelfer */
  .app { position:relative; display:flex; align-items:center; gap:16px; padding:20px 22px; background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-card); color:var(--ink); text-decoration:none; }
  .app::after { content:''; position:absolute; inset:6px; border:3px dashed var(--ink); border-radius:11px; opacity:.18; pointer-events:none; }
  .app .ic { flex:none; width:56px; height:56px; border-radius:50%; background:var(--coral); display:grid; place-items:center; font-size:1.7rem; }
  .app h2 { font-family:var(--display); font-size:1.35rem; font-weight:700; margin:0; line-height:1.15; }
  .app p { margin:2px 0 0; color:var(--ink-soft); font-size:.95rem; }
  .app.soon { opacity:.55; pointer-events:none; }
  .app.soon .ic { background:var(--coral-soft); }
  .tag { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--paper); border:1px solid var(--line); font-family:var(--body); font-size:.75rem; font-weight:700; color:var(--ink-soft); vertical-align:middle; }
</style>
</head>
<body>
<header>
  <img class="logo" src="shared/logo.png" alt="Isadody">
  <div><h1>Häkel-Apps</h1><p>Kleine Helfer fürs Häkeln</p></div>
</header>
<!-- Neue App: Karte hier eintragen; solange sie fehlt, Klasse "soon" und Markierung "bald" -->
<main id="apps">
  <a class="app" href="anleitung/">
    <span class="ic" aria-hidden="true">🧶</span>
    <div><h2>Häkelhelfer</h2><p>Anleitung laden, Masche für Masche weiterhäkeln.</p></div>
  </a>
  <a class="app" href="zaehler/">
    <span class="ic" aria-hidden="true">🔘</span>
    <div><h2>Reihenzähler</h2><p>Reihen zählen zum Draufdrücken, wie ein Pop-it.</p></div>
  </a>
  <a class="app soon" href="grid/" aria-disabled="true">
    <span class="ic" aria-hidden="true">🖼️</span>
    <div><h2>Grid-Ersteller <span class="tag">bald</span></h2><p>Bild hochladen, Muster für Tapestry-Häkeln erhalten.</p></div>
  </a>
</main>
</body>
</html>
