<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Häkel-Begleiter</title>
<style>
  :root { --bg:#fdf6f0; --fg:#3b2f2f; --chip:#fff; --accent:#c2185b; --muted:#8a7a7a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1a1a; --fg:#f3e9e9; --chip:#2e2828; --accent:#f06292; --muted:#a09090; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 0; }
  #row { font-size:1.4rem; font-weight:700; color:var(--accent); }
  #pos { font-size:.9rem; color:var(--muted); }
  button { font:inherit; border:0; cursor:pointer; }
  .small { background:none; color:var(--muted); font-size:.9rem; padding:8px; }
  #chips { flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); gap:10px; min-height:0; }
  .chip { background:var(--chip); border-radius:16px; box-shadow:0 2px 6px #0002; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:clamp(1.6rem,7vw,3.2rem); font-weight:700; }
  .chip small { font-size:.45em; font-weight:400; color:var(--muted); margin-top:4px; }
  .chip.count span { color:var(--accent); }
  #nav { display:flex; gap:10px; padding:12px 0; align-items:stretch; }
  #back { flex:0 0 22%; background:var(--chip); color:var(--fg); border-radius:14px; font-size:1.1rem; }
  #next { flex:1; background:var(--accent); color:#fff; border-radius:14px; font-size:1.8rem; font-weight:700; padding:26px 0; }
  #setup { display:none; flex:1; flex-direction:column; gap:10px; }
  #setup textarea { flex:1; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--muted); background:var(--chip); color:var(--fg); }
  #setup .row { display:flex; gap:10px; }
  #setup button { flex:1; padding:14px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; }
  #colors { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #colors label { display:flex; align-items:center; gap:4px; background:var(--chip); padding:4px 8px; border-radius:10px; }
  #colors input { width:36px; height:30px; border:0; padding:0; background:none; }
  #colors button { flex:0; padding:8px 12px; }
  #dot { display:inline-block; width:.9em; height:.9em; border-radius:50%; vertical-align:middle; margin-left:6px; border:1px solid var(--muted); }
  body.setup #setup { display:flex; } body.setup #chips, body.setup #nav { display:none; }
</style>
</head>
<body>
<header>
  <div><div id="row">–</div><div id="pos"></div></div>
  <button class="small" id="menu">Anleitung laden</button>
</header>
<main id="chips"></main>
<div id="nav"><button id="back">‹ Zurück</button><button id="next">Weiter ›</button></div>
<section id="setup">
  <p>Häkelanleitung als Textdatei laden oder hier einfügen. Beispiel:<br>
  <code>R1: 6 fM in Fadenring<br>R2: 6 Zun<br>R3: (fM, Zun) x 6</code><br>
  Englisch: <code>Row 1: Use color A, bs, 254sc, bs</code><br>
  Farben (A, B, …) unten festlegen – die Maschen erscheinen dann in dieser Farbe.</p>
  <div id="colors"></div>
  <textarea id="text" placeholder="R1: 6 fM in Fadenring"></textarea>
  <div class="row"><input type="file" id="file" accept=".txt,text/plain"><button id="ok">Starten</button></div>
</section>
<script>
const MAX_CHIPS = 8, SINGLE_MAX = 3; // Folgen bis 3 Maschen einzeln, ab 4 als ein Kürzel mit Anzahl

function splitTop(s) {
  const out = []; let d = 0, cur = '';
  for (const c of s) {
    if (c === '(') d++; if (c === ')') d--;
    if (c === ',' && d === 0) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out.map(x => x.trim()).filter(Boolean);
}

function expand(s) {
  const res = [];
  for (const part of splitTop(s)) {
    let m = part.match(/^\((.*)\)\s*(?:[x×*]\s*(\d+)|(\d+)\s*[x×*])$/i);
    if (m) { const n = +(m[2] || m[3]); const inner = expand(m[1]); for (let i = 0; i < n; i++) res.push(...inner); continue; }
    m = part.match(/^(?:(\d+)\s*)?([A-Za-zÄÖÜäöüß]+)/);
    if (!m) continue;
    for (let i = 0; i < (+m[1] || 1); i++) res.push(m[2]);
  }
  return res;
}

function chipsOf(stitches) {
  const chips = [];
  for (let i = 0; i < stitches.length;) {
    let j = i; while (j < stitches.length && stitches[j] === stitches[i]) j++;
    const n = j - i;
    if (n <= SINGLE_MAX) for (let k = 0; k < n; k++) chips.push({ s: stitches[i], n: 1 });
    else chips.push({ s: stitches[i], n });
    i = j;
  }
  return chips;
}

function parse(text) {
  const rows = []; let color = '';
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const m = line.match(/^\s*(?:R|Row|Reihe|Runde|Round|Rnd|Rd)\.?\s*(\d+)\s*[:.\-–]?\s*(.*)$/i);
    const label = m ? m[1] : String(rows.length + 1);
    let body = m ? m[2] : line;
    const cm = body.match(/(?:(?:use|wechsel\w*|nimm|change)\s+)?(?:to\s+|zu\s+)?(?:farbe|colou?r)\s+([\p{L}\d]+)/iu);
    if (cm) { color = cm[1].toUpperCase(); body = body.replace(cm[0], '').replace(/^[\s:,;–-]+/, ''); }
    const chips = chipsOf(expand(body)), pages = [];
    for (let i = 0; i < chips.length; i += MAX_CHIPS) pages.push(chips.slice(i, i + MAX_CHIPS));
    if (pages.length) rows.push({ label, color, pages });
  }
  return rows;
}

const DEFAULT_COLORS = { A: '#e53935', B: '#1e88e5' };
let colors = DEFAULT_COLORS;
try { colors = { ...DEFAULT_COLORS, ...JSON.parse(localStorage.getItem('colors') || '{}') }; } catch {}
const saveColors = () => { try { localStorage.setItem('colors', JSON.stringify(colors)); } catch {} };
const textOn = hex => { const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150 ? '#222' : '#fff'; };
const colorKeysIn = t => [...t.matchAll(/(?:farbe|colou?r)\s+([\p{L}\d]+)/giu)].map(m => m[1].toUpperCase());

function renderColorPickers() {
  const keys = [...new Set([...Object.keys(colors), ...colorKeysIn($('text').value)])].sort();
  const box = $('colors'); box.innerHTML = '';
  for (const k of keys) {
    const l = document.createElement('label'), i = document.createElement('input');
    i.type = 'color'; i.value = colors[k] || '#888888';
    i.oninput = () => { colors[k] = i.value; saveColors(); };
    l.append(k, i); box.append(l);
  }
  const b = document.createElement('button'); b.textContent = '+ Farbe';
  b.onclick = () => { const n = (prompt('Name der Farbe (z. B. C)') || '').trim().toUpperCase();
    if (n) { colors[n] = colors[n] || '#888888'; saveColors(); renderColorPickers(); } };
  box.append(b);
}

const $ = id => document.getElementById(id);
let rows = [], r = 0, p = 0;
const save = () => { try { localStorage.setItem('pos', JSON.stringify({ r, p })); } catch {} };

function render() {
  if (!rows.length) { document.body.classList.add('setup'); return; }
  document.body.classList.remove('setup');
  const row = rows[r], page = row.pages[p];
  const col = colors[row.color];
  $('row').innerHTML = `Reihe ${row.label}` + (col ? `<span id="dot" style="background:${col}" title="Farbe ${row.color}"></span>` : '');
  $('pos').textContent = `Seite ${p + 1}/${row.pages.length} · ${r + 1}/${rows.length}`;
  const style = col ? ` style="background:${col};color:${textOn(col)}"` : '';
  $('chips').innerHTML = page.map(c => c.n > 1
    ? `<div class="chip count"${style}><span${col ? ' style="color:inherit"' : ''}>${c.n}×</span>${c.s}</div>` : `<div class="chip"${style}>${c.s}</div>`).join('');
  $('back').disabled = r === 0 && p === 0;
  const last = r === rows.length - 1 && p === row.pages.length - 1;
  $('next').textContent = last ? 'Fertig ✓' : 'Weiter ›';
  $('next').disabled = last;
  save();
}

$('next').onclick = () => { if (p < rows[r].pages.length - 1) p++; else if (r < rows.length - 1) { r++; p = 0; } render(); };
$('back').onclick = () => { if (p > 0) p--; else if (r > 0) { r--; p = rows[r].pages.length - 1; } render(); };
$('menu').onclick = () => { renderColorPickers(); document.body.classList.add('setup'); };
$('text').oninput = renderColorPickers;
$('file').onchange = async e => { const f = e.target.files[0]; if (f) { $('text').value = await f.text(); renderColorPickers(); } };
$('ok').onclick = () => {
  rows = parse($('text').value); r = p = 0;
  try { localStorage.setItem('pattern', $('text').value); } catch {}
  render();
};

try {
  const t = localStorage.getItem('pattern');
  if (t) { $('text').value = t; rows = parse(t); const s = JSON.parse(localStorage.getItem('pos') || '{}');
    if (rows[s.r] && rows[s.r].pages[s.p]) { r = s.r; p = s.p; } }
} catch {}
renderColorPickers();
render();
</script>
</body>
</html>
