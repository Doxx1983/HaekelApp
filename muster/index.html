<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isadody Mustersammlung</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../shared/icon-180.png">
<link rel="stylesheet" href="../shared/isadody.css">
<script src="../shared/store.js"></script>
<script src="../shared/dialog.js"></script>
<script src="../shared/projekte.js"></script>
<script src="../shared/sicherung.js"></script>
<script src="../shared/muster-db.js"></script>
<script src="../shared/doctext.js"></script>
<style>
  body { padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); max-width:960px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0 4px; }
  #count { color:var(--ink-soft); font-size:.9rem; }
  input, textarea { font:inherit; padding:10px 14px; border-radius:999px; border:var(--field-border); background:#fff; color:var(--ink); min-width:0; }
  textarea { border-radius:16px; resize:vertical; }
  #bar { display:flex; gap:10px; padding:12px 0 8px; }
  #q { flex:1; }
  /* „+ Muster“ schwebt unten rechts; einziger Coral-Knopf der Seite */
  #add { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:4; padding:14px 22px; white-space:nowrap; }
  body.open #add, body.paste #add { display:none; }
  #filters { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:6px; }
  .pill { min-height:40px; background:var(--paper-alt); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:.85rem; font-weight:700; color:var(--ink); }
  .pill.on { background:var(--coral-soft); border-color:var(--ink); }
  .pill.sort { margin-left:auto; color:var(--ink-soft); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:8px 0 96px; }
  /* Karte mit angedeuteter Naht wie die Kacheln im Häkelhelfer */
  .card { position:relative; display:flex; flex-direction:column; text-align:left; padding:8px; background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-card); }
  .card::after { content:''; position:absolute; inset:4px; border:2px dashed var(--ink); border-radius:13px; opacity:.15; pointer-events:none; }
  .thumb { aspect-ratio:1; border-radius:10px; background:var(--paper); overflow:hidden; display:grid; place-items:center; font-size:2.6rem; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb pre { margin:0; padding:8px; width:100%; height:100%; font:600 .7rem/1.35 var(--body); color:var(--ink-soft); white-space:pre-wrap; overflow:hidden; align-self:start; }
  .card h3 { font-family:var(--display); font-size:1.05rem; font-weight:700; margin:6px 2px 0; line-height:1.2; overflow-wrap:anywhere; }
  .card .tags { display:flex; flex-wrap:wrap; gap:4px; margin:4px 2px 2px; }
  .tg { font-size:.72rem; font-weight:700; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .star { position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; background:var(--paper); display:grid; place-items:center; font-size:1rem; box-shadow:var(--shadow-card); }
  #empty { text-align:center; color:var(--ink-soft); padding:40px 10px; }
  #empty .note { font-size:.85rem; }
  /* Detailansicht */
  #detail { position:fixed; inset:0; background:var(--paper); overflow:auto; padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); display:none; }
  body.open #detail { display:block; } body.open { overflow:hidden; }
  #detail .in { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  #detail .top { display:flex; align-items:center; gap:10px; padding:12px 0 0; }
  #detail .top #close { margin-right:auto; }
  #prev { background:var(--paper-alt); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  #prev img { display:block; width:100%; height:auto; }
  #prev iframe { display:block; width:100%; height:70vh; border:0; background:#fff; }
  #prev pre { margin:0; padding:14px; max-height:60vh; overflow:auto; white-space:pre-wrap; font:inherit; }
  #prev .pdf { padding:30px; text-align:center; font-size:3rem; }
  #prev .note { font-size:.9rem; color:var(--ink-soft); margin:8px 0 0; }
  #title { font-family:var(--display); font-size:1.4rem; font-weight:700; border-radius:16px; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:.85rem; font-weight:700; color:var(--ink-soft); }
  #dtags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #dtags .tg { font-size:.85rem; padding:4px 6px 4px 12px; display:flex; align-items:center; gap:4px; color:var(--ink); }
  #dtags .tg button { background:none; padding:0 4px; font-size:1rem; line-height:1; color:var(--ink-soft); }
  #tagin { flex:1; min-width:140px; }
  #dbtns { display:flex; flex-wrap:wrap; gap:10px; }
  #dbtns .btn { flex:1 1 220px; }
  #dbtns .small { padding:12px 18px; }
  #meta { color:var(--ink-soft); font-size:.8rem; }
  /* Text einfügen */
  #paste { display:none; flex-direction:column; gap:10px; padding:10px 0 20px; }
  body.paste #paste { display:flex; } body.paste #grid, body.paste #empty, body.paste #filters { display:none !important; }
  #paste textarea { min-height:40vh; }
  #paste .row { display:flex; gap:10px; } #paste .row .btn { flex:1; }
  #menu { position:absolute; right:16px; top:100%; margin-top:6px; background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-soft); padding:6px; display:none; flex-direction:column; z-index:5; min-width:220px; }
  #menu.on { display:flex; }
  /* Menü von „+ Muster“ öffnet über dem Knopf */
  #menu.add { position:fixed; top:auto; right:16px; bottom:calc(80px + env(safe-area-inset-bottom)); }
  #menu button { background:none; text-align:left; padding:10px 12px; border-radius:10px; font-weight:700; }
  #menu button:hover { background:var(--paper-alt); }
  #menu.add .m-save, #menu.save .m-add { display:none; }
  .wrap { position:relative; }
  #drop { position:fixed; inset:0; background:rgba(251,217,203,.85); display:none; place-items:center; font-family:var(--display); font-size:1.6rem; font-weight:700; pointer-events:none; z-index:9; }
  body.drag #drop { display:grid; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-weight:700; font-size:.9rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:10; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="title"><a class="home" href="../" aria-label="Alle Apps" title="Alle Apps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg></a><img class="logo" src="../shared/logo.png" alt="Isadody"><div><h1 class="apptitle">Mustersammlung</h1><div id="count"></div></div></div>
  <div class="tools"><a class="help" href="hilfe/" aria-label="Hilfe" title="Hilfe">?</a><button class="small icon-m" id="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg><span class="lbl">Sichern</span></button></div>
</header>
<div class="wrap">
  <div id="bar"><input id="q" type="search" placeholder="Suchen …" aria-label="Suchen: Name, Tag, Notiz, Text"><button class="btn" id="add">+ Muster</button></div>
  <div id="menu">
    <button class="m-add" data-a="file">Datei hinzufügen (Bild, PDF, Word, Text)</button>
    <button class="m-add" data-a="paste">Text einfügen</button>
    <button class="m-save" data-a="export">Alles sichern (alle Apps)</button>
    <button class="m-save" data-a="import">Sicherung einspielen</button>
  </div>
</div>
<div id="filters"></div>
<main id="grid"></main>
<div id="empty"></div>
<section id="paste">
  <input id="ptitle" placeholder="Name, z. B. Amigurumi Hase">
  <textarea id="ptext" placeholder="Anleitung hier einfügen, z. B.&#10;R1: 6 fM in Fadenring&#10;R2: 6 Zun"></textarea>
  <div class="row"><button class="small" id="pcancel">Abbrechen</button><button class="btn" id="psave">Speichern</button></div>
</section>
<section id="detail"><div class="in">
  <div class="top"><button class="small" id="close">‹ Zurück</button><button class="small" id="dfav">☆ Favorit</button></div>
  <div id="prev"></div>
  <input id="title" aria-label="Name">
  <label class="f">Tags<div id="dtags"><input id="tagin" list="alltags" placeholder="Tag hinzufügen, z. B. Amigurumi"></div></label>
  <datalist id="alltags"></datalist>
  <label class="f">Notizen<textarea id="notes" rows="3" placeholder="Garn, Nadelstärke, Quelle …"></textarea></label>
  <div id="dbtns"></div>
  <div id="meta"></div>
</div></section>
<input type="file" id="file" multiple hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div id="drop">Loslassen zum Hinzufügen</div>
<div id="toast"></div>
<script>
// Muster liegen in IndexedDB (Bilder und PDFs sind zu groß für localStorage), Einstellungen im Store.
const store = Store('muster');
const $ = id => document.getElementById(id);
const ST = MusterDB.ST;
$('file').accept = FILE_ACCEPT;
let db, items = [], sel = new Set(store.get('tags', [])), favOnly = store.get('fav', false), sort = store.get('sort', 'neu'), cur = null;
const urls = new Map(); // id → Objekt-URL fürs Vorschaubild

const tx = (mode, fn) => new Promise((ok, err) => {
  const t = db.transaction(ST, mode), s = t.objectStore(ST), res = fn(s);
  t.oncomplete = () => ok(res && res.result); t.onerror = () => err(t.error); t.onabort = () => err(t.error);
});
const put = it => tx('readwrite', s => s.put(it));
const del = id => tx('readwrite', s => s.delete(id));
const all = () => tx('readonly', s => s.getAll());

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2200); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const baseName = n => n.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
const normTag = t => t.replace(/^#/, '').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

// kleines Vorschaubild, damit die Übersicht auch bei vielen Fotos flott bleibt
async function thumbOf(blob) {
  try {
    const img = await createImageBitmap(blob), k = Math.min(1, 360 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .8));
  } catch { return null; }
}

async function addFiles(files) {
  let n = 0, skip = 0;
  for (const f of files) {
    const kind = fileKind(f); if (!kind) { skip++; continue; }
    const it = { id: uid(), kind, title: baseName(f.name) || 'Muster', name: f.name, mime: f.type || (kind === 'pdf' ? 'application/pdf' : 'text/plain'), size: f.size, tags: [], fav: false, notes: '', added: Date.now() };
    if (kind === 'text') it.text = await f.text(); else { it.blob = f; if (kind === 'image') it.thumb = await thumbOf(f); if (kind === 'word') it.text = await docText(f); }
    try { await put(it); } catch { render(); return toast(n ? `Speicher voll: nur ${n} Muster hinzugefügt` : 'Speicher voll: Muster nicht gespeichert'); }
    items.push(it); n++;
  }
  persist(); render();
  toast(n ? `${n} Muster hinzugefügt` + (skip ? `, ${skip} übersprungen` : '') : 'Nur Bilder, PDFs, Word-, ODT- und Textdateien möglich');
  if (n === 1) show(items[items.length - 1].id);
}
// Browser bitten, die Sammlung nicht automatisch zu löschen, wenn der Speicher knapp wird
function persist() { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }

function allTags() {
  const m = new Map();
  for (const it of items) for (const t of it.tags) { const k = t.toLowerCase(); m.set(k, { t: m.has(k) ? m.get(k).t : t, n: (m.get(k)?.n || 0) + 1 }); }
  return [...m.values()].sort((a, b) => b.n - a.n || a.t.localeCompare(b.t, 'de'));
}
function visible() {
  const q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const want = [...sel].map(t => t.toLowerCase());
  return items.filter(it => {
    if (favOnly && !it.fav) return false;
    const tags = it.tags.map(t => t.toLowerCase());
    if (!want.every(t => tags.includes(t))) return false;
    const hay = [it.title, it.notes, it.name, ...it.tags, it.text || ''].join(' ').toLowerCase();
    return q.every(w => hay.includes(w));
  }).sort(sort === 'name' ? (a, b) => a.title.localeCompare(b.title, 'de') : (a, b) => b.added - a.added);
}

function thumbHtml(it) {
  if (it.kind === 'image' && (it.thumb || it.blob)) {
    if (!urls.has(it.id)) urls.set(it.id, URL.createObjectURL(it.thumb || it.blob));
    return `<img src="${urls.get(it.id)}" alt="">`;
  }
  if (it.text) return `<pre>${esc(it.text.slice(0, 400))}</pre>`;
  return it.kind === 'word' ? '📝' : '📄';
}
function render() {
  const tags = allTags();
  for (const t of [...sel]) if (!tags.some(x => x.t.toLowerCase() === t.toLowerCase())) sel.delete(t);
  store.set('tags', [...sel]); store.set('fav', favOnly); store.set('sort', sort);
  $('filters').innerHTML = items.length ? `<button class="pill${favOnly ? ' on' : ''}" data-fav>★ Favoriten</button>` +
    tags.map(x => `<button class="pill${[...sel].some(s => s.toLowerCase() === x.t.toLowerCase()) ? ' on' : ''}" data-tag="${esc(x.t)}">${esc(x.t)} <small>${x.n}</small></button>`).join('') +
    `<button class="pill sort" data-sort>${sort === 'name' ? 'A–Z' : 'Neueste'} ⇅</button>` : '';
  $('alltags').innerHTML = tags.map(x => `<option value="${esc(x.t)}">`).join('');
  const vis = visible();
  $('count').textContent = items.length ? (vis.length === items.length ? `${items.length} Muster` : `${vis.length} von ${items.length} Mustern`) : '';
  $('grid').innerHTML = vis.map(it => `<button class="card" data-id="${esc(it.id)}">
    <div class="thumb">${thumbHtml(it)}</div>${it.fav ? '<span class="star">★</span>' : ''}
    <h3>${esc(it.title)}</h3>${it.tags.length ? `<div class="tags">${it.tags.map(t => `<span class="tg">${esc(t)}</span>`).join('')}</div>` : ''}</button>`).join('');
  // Leere Sammlung: Suche erst ab dem ersten Muster
  $('q').hidden = !items.length;
  $('empty').innerHTML = !items.length ? `<p>Noch keine Muster. Lege Bilder, PDFs, Word-, ODT- oder Textdateien ab und ordne sie mit Tags.</p><p class="note">Die Muster bleiben nur auf diesem Gerät. Gekaufte Anleitungen bitte nicht weitergeben.</p><p>Tippe unten rechts auf <b>+ Muster</b>.</p>`
    : !vis.length ? '<p>Nichts gefunden. Filter oder Suche ändern.</p>' : '';
}

function show(id) {
  cur = items.find(it => it.id === id); if (!cur) return;
  const p = $('prev'); p.innerHTML = '';
  if (cur.kind === 'image') { const u = URL.createObjectURL(cur.blob); p.innerHTML = `<img src="${u}" alt="">`; p.dataset.url = u; }
  else if (cur.kind === 'pdf') {
    const u = URL.createObjectURL(new Blob([cur.blob], { type: 'application/pdf' })); p.dataset.url = u;
    // eingebettete PDF-Anzeige gibt es nicht auf allen Handys, darum zusätzlich „Öffnen“
    p.innerHTML = matchMedia('(pointer:fine)').matches ? `<iframe src="${u}" title="PDF"></iframe>` : '<div class="pdf">📄</div>';
  } else if (cur.kind === 'word' && !cur.text) p.innerHTML = '<div class="pdf">📝<p class="note">Keine Vorschau für ältere .doc-Dateien. Zum Ansehen herunterladen.</p></div>';
  else p.innerHTML = `<pre>${esc(cur.text || '')}</pre>`;
  $('title').value = cur.title; $('notes').value = cur.notes || '';
  renderDetail();
  $('meta').textContent = `${cur.name || 'Eingefügter Text'} · ${cur.kind === 'text' ? (cur.text || '').length + ' Zeichen' : kb(cur.size || 0)} · hinzugefügt am ${new Date(cur.added).toLocaleDateString('de-DE')}`;
  document.body.classList.add('open'); $('detail').scrollTop = 0;
  history.pushState({ d: 1 }, '');
}
function renderDetail() {
  $('dfav').textContent = cur.fav ? '★ Favorit' : '☆ Favorit';
  $('dtags').querySelectorAll('.tg').forEach(e => e.remove());
  $('tagin').insertAdjacentHTML('beforebegin', cur.tags.map((t, i) => `<span class="tg">${esc(t)}<button data-rm="${i}" aria-label="Tag ${esc(t)} entfernen">×</button></span>`).join(''));
  $('dbtns').innerHTML = (cur.kind === 'text' || cur.text ? '<button class="btn" data-a="helper">Im Häkelhelfer öffnen</button>' : '') +
    (cur.grid ? '<button class="btn" data-a="grid">Im Grid-Ersteller öffnen</button>' : '') +
    (cur.kind === 'pdf' || cur.kind === 'image' ? `<button class="btn" data-a="openfile">${cur.kind === 'pdf' ? 'PDF öffnen' : 'Bild öffnen'}</button>` : '') +
    '<button class="small" data-a="download">Herunterladen</button><button class="small" id="del" data-a="delete">Löschen</button>';
}
function close() {
  if (!document.body.classList.contains('open')) return;
  const p = $('prev'); if (p.dataset.url) { URL.revokeObjectURL(p.dataset.url); delete p.dataset.url; } p.innerHTML = '';
  document.body.classList.remove('open'); cur = null; render();
}
const saveCur = () => cur && put(cur).catch(() => toast('Speicher voll: Änderung nicht gespeichert'));

function addTag(raw) {
  let changed = false;
  for (const t of raw.split(',').map(normTag).filter(Boolean)) if (!cur.tags.some(x => x.toLowerCase() === t.toLowerCase())) { cur.tags.push(t); changed = true; }
  if (changed) { saveCur(); renderDetail(); }
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileName = it => it.name || (it.title.replace(/[^\wäöüÄÖÜß -]+/g, '').trim() || 'muster') + '.txt';
const blobOf = it => it.kind === 'text' ? new Blob([it.text || ''], { type: 'text/plain;charset=utf-8' }) : new Blob([it.blob], { type: it.mime });

// Sicherung: alle Apps samt Sammlung in einer Datei (shared/sicherung.js); Einspielen prüft jedes Feld
async function exportAll() { toast('Sicherung wird erstellt …'); try { await Sicherung.save(); } catch { toast('Sicherung nicht möglich'); } }
async function importAll(f) {
  const r = await Sicherung.restore(f);
  try { items = await all(); } catch {}
  render(); toast(r.text);
}

// Text an den Häkelhelfer übergeben: neues Projekt dort, oder das vorhandene mit derselben Anleitung
function openInHelper(it) {
  // Garnfarben aus dem Grid-Ersteller gehen mit
  if (!Projekte.open(it.text, it.title, it.colors)) return Dialog.alert(Projekte.FULL_MSG);
  location.href = '../anleitung/';
}
// Muster aus dem Grid-Ersteller dort weiterbearbeiten; erneutes Speichern aktualisiert dieses Muster
async function openInGrid(it) {
  const g = Store('grid');
  if (g.get('state', null) && g.get('mid', null) !== it.id && !(await Dialog.confirm('Der aktuelle Stand im Grid-Ersteller wird ersetzt. Weiter?', { ok: 'Ersetzen' }))) return;
  g.set('state', { G: it.grid.G, o: it.grid.o, keep: it.grid.keep !== false }); g.set('src', it.grid.src || ''); g.set('mid', it.id);
  location.href = '../grid/';
}

async function act(a) {
  $('menu').classList.remove('on');
  if (a === 'file') $('file').click();
  else if (a === 'paste') { $('ptitle').value = ''; $('ptext').value = ''; document.body.classList.add('paste'); $('ptext').focus(); }
  else if (a === 'export') exportAll();
  else if (a === 'import') $('imp').click();
  else if (!cur) return;
  else if (a === 'helper') openInHelper(cur);
  else if (a === 'grid') openInGrid(cur);
  else if (a === 'openfile') window.open($('prev').dataset.url, '_blank');
  else if (a === 'download') download(blobOf(cur), fileName(cur));
  else if (a === 'delete') {
    if (!(await Dialog.confirm(`„${cur.title}“ wirklich löschen?`, { ok: 'Löschen', danger: true }))) return;
    const id = cur.id; del(id).catch(() => toast('Löschen nicht möglich')); items = items.filter(it => it.id !== id);
    if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
    history.back(); toast('Gelöscht');
  }
}

// „+ Muster“ zeigt Datei/Text, „Sichern“ nur die Sicherung
function menu(mode) {
  const m = $('menu'), again = m.classList.contains('on') && m.classList.contains(mode);
  m.className = again ? '' : 'on ' + mode;
}
$('add').onclick = e => { e.stopPropagation(); menu('add'); };
$('more').onclick = e => { e.stopPropagation(); menu('save'); };
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (b) return act(b.dataset.a);
  if (!e.target.closest('#menu')) $('menu').classList.remove('on');
});
$('file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) addFiles(f); };
$('imp').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importAll(f); };
$('q').oninput = render;
$('filters').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('fav' in b.dataset) favOnly = !favOnly;
  else if ('sort' in b.dataset) sort = sort === 'name' ? 'neu' : 'name';
  else { const t = b.dataset.tag, hit = [...sel].find(s => s.toLowerCase() === t.toLowerCase()); hit ? sel.delete(hit) : sel.add(t); }
  render();
};
$('grid').onclick = e => { const c = e.target.closest('.card'); if (c) show(c.dataset.id); };
$('close').onclick = () => history.back();
window.onpopstate = close;
$('dfav').onclick = () => { cur.fav = !cur.fav; saveCur(); renderDetail(); };
$('title').onchange = () => { cur.title = $('title').value.trim() || 'Muster'; $('title').value = cur.title; saveCur(); };
$('notes').onchange = () => { cur.notes = $('notes').value; saveCur(); };
$('tagin').onkeydown = e => { if ((e.key === 'Enter' || e.key === ',') && $('tagin').value.trim()) { e.preventDefault(); addTag($('tagin').value); $('tagin').value = ''; } };
$('tagin').onchange = () => { if ($('tagin').value.trim()) { addTag($('tagin').value); $('tagin').value = ''; } };
$('dtags').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { e.preventDefault(); cur.tags.splice(+b.dataset.rm, 1); saveCur(); renderDetail(); } };
$('pcancel').onclick = () => document.body.classList.remove('paste');
$('psave').onclick = async () => {
  const text = $('ptext').value; if (!text.trim()) return toast('Bitte Text einfügen');
  const title = $('ptitle').value.trim() || text.trim().split('\n')[0].slice(0, 40);
  const it = { id: uid(), kind: 'text', title, name: '', mime: 'text/plain', size: text.length, text, tags: [], fav: false, notes: '', added: Date.now() };
  try { await put(it); } catch { return toast('Speicher voll: Text nicht gespeichert'); }
  items.push(it); persist(); document.body.classList.remove('paste'); render(); show(it.id);
};
// Dateien auf die Seite ziehen (Computer)
let dragN = 0;
addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragN++; document.body.classList.add('drag'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('drag'); const f = [...e.dataTransfer.files]; if (f.length) addFiles(f); });

MusterDB.open().then(async d => { db = d; items = await all(); render(); })
  .catch(() => { $('empty').innerHTML = '<p>Dieser Browser erlaubt keinen Speicher für die Sammlung (z. B. privates Fenster).</p>'; });
</script>
</body>
</html>
